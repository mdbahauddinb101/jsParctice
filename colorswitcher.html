<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color switcher project</title>
    <link rel="stylesheet" href="./colorswitcher.css" />
  </head>

  <body>
    <div class="container">
      <h1 class="heading">Color switcher</h1>

      <div class="inputbtn-container">
        <button class="randomColor">Random Color</button>
        <input
          id="colorInput"
          type="text"
          placeholder="Enter a color or hex (e.g. white or #ffffff)"
        />
        <button class="applyColor">Apply Color</button>
        <p class="currentColor">
          Current color: <span class="currentColorValue"></span>
        </p>
      </div>
    </div>

    <script src="./clolorswitcher.js"></script>
  </body>
</html>
